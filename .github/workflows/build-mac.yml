name: Build macOS

# 手动触发，或推 v* 标签时触发。产物上传为 workflow artifact（保留 30 天），
# 不自动发 Release —— 签名/公证没配好之前，先让人下载验证再决定发布。
on:
  workflow_dispatch:
    inputs:
      arch:
        description: '只构建某个架构（arm64 排队紧张时单独重试）'
        type: choice
        options:
          - all
          - arm64
          - x64
        default: all
      release:
        description: '同时上传到 Release（需已存在 tag）'
        type: boolean
        default: false
      release_tag:
        description: 'release=true 时上传到哪个 tag（留空则用当前 ref）'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 仅 release=true 时需要上传资产

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # 用 fromJSON 按输入生成矩阵：job 级 if 不能引用 matrix（GitHub 限制），
      # 只能在这里过滤。arm64 用明确的 macos-26；排队超时可单独重试。
      matrix:
        include: ${{ fromJSON(inputs.arch == 'arm64' && '[{"arch":"arm64","runner":"macos-26"}]' || inputs.arch == 'x64' && '[{"arch":"x64","runner":"macos-15-intel"}]' || '[{"arch":"arm64","runner":"macos-26"},{"arch":"x64","runner":"macos-15-intel"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify runner architecture
        run: |
          echo "uname -m: $(uname -m)"
          echo "expected: ${{ matrix.arch }}"
          ACTUAL=$(uname -m)
          if [ "${{ matrix.arch }}" = "arm64" ] && [ "$ACTUAL" != "arm64" ]; then
            echo "::error::expected arm64 runner, got $ACTUAL"; exit 1
          fi
          if [ "${{ matrix.arch }}" = "x64" ] && [ "$ACTUAL" != "x86_64" ]; then
            echo "::error::expected x64 runner, got $ACTUAL"; exit 1
          fi

      # build.spec 的 hiddenimports 依赖 PyInstaller；rapidocr/ctranslate2/onnx
      # 在 macOS arm64 上都有官方 wheel，pip 会按架构自动选。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Record dependency versions
        run: |
          python -m pip freeze | grep -iE 'pyinstaller|onnxruntime|ctranslate2|faster|rapidocr|pywebview|fastapi' || true

      # 仓库里的 vendor/ 是从 Windows 机器装好提交的，lxml 里全是
      # etree.cp313-win_amd64.pyd 这类 Windows 编译产物，macOS 上 import 必失败
      # （自检会报 vendor: lxml / python-docx 导入失败 → Word 导出废掉）。
      # 这里按当前平台重新装一份，产物只用于本次构建，不回写仓库。
      - name: Refresh vendor for macOS
        run: |
          rm -rf vendor
          python -m pip install --target vendor --upgrade --no-compile \
            python-docx latex2mathml mathml2omml typing_extensions lxml
          echo "=== vendor 顶层 ==="
          ls vendor | head
          echo "=== 编译扩展（应为 .so 而非 .pyd）==="
          find vendor -name "*.so" | head -8
          if find vendor -name "*.pyd" | grep -q .; then
            echo "::error::vendor 里仍有 Windows 的 .pyd，平台装错了"
            exit 1
          fi
          echo "=== 冒烟导入 ==="
          PYTHONPATH=vendor python -c "import lxml.etree as e; print('lxml', e.LXML_VERSION); import docx; print('docx ok')"

      # 确保没有 Windows 的 bin/ 混进来：CI 是干净的 checkout，本就不该有，
      # 这里显式断言一次，避免误把 GPL 的 Windows exe 打进 Mac 包。
      - name: Assert no bundled ffmpeg
        run: |
          if [ -d bin ]; then
            echo "::warning::bin/ exists in checkout; removing before Mac build"
            rm -rf bin
          fi

      - name: Build .app with PyInstaller
        run: python -m PyInstaller build-mac.spec --noconfirm

      - name: Verify .app bundle
        run: |
          test -d dist/BiliNotes.app
          test -f dist/BiliNotes.app/Contents/MacOS/BiliNotes
          test -f dist/BiliNotes.app/Contents/Info.plist
          echo "app bundle OK"
          # 冻结环境自检：证明 .app 里的 Python 逻辑能跑（含音画锚定等）。
          # 窗口程序的 stdout 是 devnull，自检详情必须经 BILINOTES_PROBE_OUT 落文件再 cat。
          # 用 console 版跑自检（窗口版 stdout 是 devnull，报错看不到）
          PROBE_EXE="dist/BiliNotes.app/Contents/MacOS/BiliNotes-console"
          [ -x "$PROBE_EXE" ] || PROBE_EXE="dist/BiliNotes.app/Contents/MacOS/BiliNotes"
          echo "probe exe: $PROBE_EXE"
          set +e
          BILINOTES_PROBE=bn_selftest BILINOTES_CRASHLOG=0 \
            BILINOTES_PROBE_OUT="$RUNNER_TEMP/selftest.txt" \
            "$PROBE_EXE"
          ST=$?
          set -e
          echo "selftest exit=$ST"
          if [ -f "$RUNNER_TEMP/selftest.txt" ]; then
            echo "===== selftest report ====="
            cat "$RUNNER_TEMP/selftest.txt"
            echo "===== end report ====="
          else
            echo "::warning::自检未写出报告文件（可能在导入阶段就崩了）"
          fi
          if [ "$ST" -ne 0 ]; then
            echo "::error::frozen selftest failed (exit $ST) — 详见上方报告，勿发布此包"
            exit 1
          fi

      - name: Make dmg
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('app/__init__.py').read()).group(1))")
          DMG="BiliNotes-${VERSION}-macos-${{ matrix.arch }}.dmg"
          hdiutil create -volname "BiliNotes" -srcfolder dist/BiliNotes.app \
            -ov -format UDZO "$DMG"
          echo "DMG=$DMG" >> $GITHUB_ENV
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          ls -lh "$DMG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliNotes-macos-${{ matrix.arch }}
          path: |
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256
          retention-days: 30

      - name: Upload to Release (optional)
        if: ${{ inputs.release && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG: ${{ env.DMG }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${RELEASE_TAG:-$REF_NAME}"
          echo "uploading to release tag: $TAG"
          gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
